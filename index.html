<!doctype html>
<html lang="en" class="pk-theme-atomic">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores the manifest's SVG icon for "Add to Home Screen" - it
         wants an explicit apple-touch-icon PNG, or falls back to a
         screenshot of the page. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Launches full-screen with no browser chrome once added to the home
         screen (Safari-specific - the manifest's display:'standalone' alone
         isn't enough on iOS), and gives it a proper name there instead of
         falling back to the page title or URL. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nextrek" />
    <!-- Tints Safari's tab bar and the title bar of a macOS "Add to Dock"
         web app to match the manifest's theme_color. A white bar that stays
         at the top in full screen isn't this - it's the web app's View >
         "Always Show Toolbar in Full Screen" setting, which only the user
         can change. -->
    <meta name="theme-color" content="#000000" />
    <title>Nextrek</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
